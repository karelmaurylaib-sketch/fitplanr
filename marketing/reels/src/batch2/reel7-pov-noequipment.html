<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="pov2.css">
<script src="kit.js"></script><script src="kit2.js"></script><script src="timing2.js"></script>
<style>.st{position:absolute;left:72px;font:600 54px Inter;opacity:0;white-space:nowrap}.st i{position:absolute;left:-8px;right:-8px;top:52%;height:6px;background:var(--lime);border-radius:3px;transform-origin:left;transform:scaleX(0)}</style>
</head><body><div class="stage">
<div class="dots"></div><div class="glow"></div>
<div id="lbl" class="lbl mono lime">[ POV ]</div>
<div id="h0" class="h disp"><div>You don't own</div><div>a single</div><div class="l2">weight.</div></div>
<div id="eq" class="abs card" style="left:72px;right:72px;top:1000px;padding:34px 40px;opacity:0"><div class="mono muted" style="font-size:28px">Your equipment</div>
  <div style="font:600 58px Inter;margin-top:14px"><span id="eqt"></span><span id="eqc" class="lime">|</span></div></div>
<div id="h1" class="h s disp"><div>Every plan</div><div class="l2">online:</div></div>
<div id="list"></div>
<div id="h2" class="h disp"><div>So I told an app:</div><div class="lime">it's just me.</div></div>
<div id="gear" class="abs" style="left:0;right:0;top:960px;text-align:center;opacity:0"><span class="chip" id="gchip" style="font-size:56px;padding:30px 48px"><span id="gck" style="display:inline-block;width:0;overflow:hidden">✓</span>Bodyweight only</span></div>
<div id="h3" class="h s disp" style="top:200px;font-size:100px"><div>A real plan.</div><div class="lime">Harder every week.</div></div>
<div id="dc"></div>
<div id="wks" class="abs" style="left:60px;right:60px;top:1220px"><div class="mono muted" style="font-size:28px;margin-bottom:18px" id="wkl">Push-Up, week by week</div>
  <div style="display:flex;gap:16px" id="wkrow"></div></div>
<div id="endwrap"></div>
</div>
<script>
const T=TIMING['pov-noequipment'], S=T.S; window.DURATION=T.DURATION;
const ITEMS=['Grab your dumbbells','Load the barbell','Set the cable to 20 lb','Hop on the leg press'];
$('#list').innerHTML=ITEMS.map((s,i)=>`<div class="st" id="i${i}" style="top:${720+i*150}px">${s}<i></i></div>`).join('');
$('#dc').innerHTML=dayCard('day','Day 1 · Mon','Full Body A','30 min',[['Bodyweight Squat','3 × 8','bodyweight','90s'],['Push-Up','3 × 8','bodyweight','90s'],['Inverted Row (table or bar)','3 × 8','bodyweight','90s'],['Plank','2 × 20 s','bodyweight','60s']],440);
const W=[['Week 1','3×8',''],['Week 2','3×12',''],['Week 3','3×15',''],['Week 4','4×15','3 s down']];
$('#wkrow').innerHTML=W.map((w,i)=>`<div class="wkb" id="w${i}"><div class="w">${w[0]}</div><div class="v">${w[1]}</div><div class="n">${w[2]}</div></div>`).join('');
$('#endwrap').innerHTML=endCardFit();
window.render=(t)=>{
  rv('#lbl',t,0,.4,20,S[1]-.3); heads(t,'h0',.05,S[1]-.3);
  rv('#eq',t,.7,.5,40,S[1]-.3); const typed='nothing.'.slice(0,Math.max(0,Math.floor((t-1.2)/.09))); $('#eqt').textContent=typed; $('#eqc').style.opacity=Math.floor(t*2.4)%2;
  heads(t,'h1',S[1]+.05,S[2]-.3);
  ITEMS.forEach((s,i)=>{const a=S[1]+.35+i*.35; rv('#i'+i,t,a,.4,30,S[2]-.3); const k=eo(seg(t,a+.45,a+.75)); const el=$('#i'+i);
    el.querySelector('i').style.transform=`scaleX(${k})`; el.style.color=k>.9?'#5c6056':'';});
  heads(t,'h2',S[2]+.05,S[3]-.3);
  const gp=back(seg(t,S[2]+.4,S[2]+.9)); const on=t>S[2]+1.4; const go=eio(seg(t,S[3]-.3,S[3]));
  $('#gear').style.opacity=seg(t,S[2]+.4,S[2]+.6)*(1-go); $('#gear').style.transform=`scale(${(.7+.3*gp)*(on?1+.06*Math.sin(seg(t,S[2]+1.4,S[2]+1.7)*Math.PI):1)})`;
  $('#gchip').classList.toggle('on',on); $('#gck').style.width=on?'46px':'0';
  heads(t,'h3',S[3]+.05,S[4]-.3); renderDayCard('day',t,S[3]+.1,S[4]-.3);
  rv('#wkl',t,S[3]+1.9,.4,20,S[4]-.3);
  W.forEach((w,i)=>{const a=S[3]+2.1+i*.55; rv('#w'+i,t,a,.4,30,S[4]-.3); $('#w'+i).classList.toggle('on',t>a+.3&&t<a+.3+(i==3?99:.55));});
  if(t>S[4]-.05) renderEndFit(t,S[4]); else $('#endf').style.opacity=0;
};
</script></body></html>
