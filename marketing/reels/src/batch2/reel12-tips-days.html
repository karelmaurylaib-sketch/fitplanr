<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="tips2.css">
<script src="kit.js"></script><script src="kit2.js"></script><script src="timing2.js"></script>
<style>.grid{position:absolute;left:52px;right:52px;display:flex;gap:12px}
.dc{flex:1;height:300px;border-radius:26px;border:2px solid var(--line);background:#0E0F0C;display:flex;flex-direction:column;align-items:center;padding-top:26px;transition:none}
.dc .d{font:700 30px 'JetBrains Mono';color:var(--muted)}
.dc .n{margin-top:auto;margin-bottom:24px;font:700 36px/1 'Barlow Condensed';text-transform:uppercase;text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);height:190px;display:flex;align-items:center;justify-content:center}
.dc.on{background:var(--lime);border-color:var(--lime)} .dc.on .d,.dc.on .n{color:var(--ink)}
.rowl{position:absolute;left:72px;font:700 30px 'JetBrains Mono';letter-spacing:.12em;color:var(--lime)}</style></head><body><div class="stage">
<div class="dots"></div><div class="glow"></div>
<div id="l0" class="lbl mono lime">[ Save this ]</div>
<div id="h0" class="h disp"><div>How many days</div><div>a week should</div><div class="l2">you train?</div></div>
<div id="l1" class="lbl mono lime">2–3 days</div>
<div id="h1" class="h s disp"><div>Full body.</div><div class="l2">Every muscle, 2–3×.</div></div>
<div id="l2" class="lbl mono lime">4 days</div>
<div id="h2" class="h s disp"><div>Upper / lower.</div><div class="l2">Each muscle, 2×.</div></div>
<div id="l3" class="lbl mono lime">5 days</div>
<div id="h3" class="h s disp"><div>Push, pull, legs</div><div class="l2">+ upper / lower.</div></div>
<div id="ra" class="rowl" style="top:700px;opacity:0"></div>
<div id="ga" class="grid" style="top:750px;opacity:0"></div>
<div id="rb" class="rowl" style="top:1110px;opacity:0"></div>
<div id="gb" class="grid" style="top:1160px;opacity:0"></div>
<div id="h4" class="h disp" style="top:300px;font-size:128px"><div>Start with</div><div>the days you'll</div><div class="lime">actually keep.</div></div>
<div id="s4" class="sub" style="top:900px">FitPlanr picks the split from your days, then plans <b>4 weeks</b> of it.</div>
<div id="endwrap"></div>
</div>
<script>
const T=TIMING['tips-days'], S=T.S; window.DURATION=T.DURATION;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const mk=(id)=>{$('#'+id).innerHTML=DAYS.map((d,i)=>`<div class="dc" id="${id}${i}"><div class="d">${d[0]}</div><div class="n"></div></div>`).join('');};
mk('ga'); mk('gb'); $('#endwrap').innerHTML=endCardFit();
// [scene, rowA label, rowA map, rowB label, rowB map] from the engine's SPLITS
const SC={1:['2 days',{0:'Full A',3:'Full B'},'3 days',{0:'Full A',2:'Full B',4:'Full C'}],
          2:['4 days',{0:'Upper A',1:'Lower A',3:'Upper B',4:'Lower B'},null,null],
          3:['5 days',{0:'Push',1:'Pull',2:'Legs',4:'Upper',5:'Lower'},null,null]};
function fill(g,map,t,a){ DAYS.forEach((d,i)=>{const c=$('#'+g+i); const on=map&&map[i]!=null; const k=Object.keys(map||{}).indexOf(String(i));
  const lit=on&&t>a+k*.25; c.classList.toggle('on',lit); c.querySelector('.n').textContent=on?map[i]:'';
  c.style.transform=lit?`scale(${1+.06*Math.sin(seg(t,a+k*.25,a+k*.25+.25)*Math.PI)})`:'';});}
window.render=(t)=>{
  for(let k=0;k<5;k++){ if(k<4) rv('#l'+k,t,S[k]+.02,.4,20,S[k+1]-.3); heads(t,'h'+k,S[k]+.05,S[k+1]-.3); }
  // grids visible from scene 0 (empty) through scene 3
  const gv=eo(seg(t,.7,1.2))*(1-eio(seg(t,S[4]-.3,S[4])));
  let k=t<S[1]?0:t<S[2]?1:t<S[3]?2:3; const c=SC[k];
  $('#ga').style.opacity=gv; $('#ga').style.transform=`translateY(${(1-eo(seg(t,.7,1.2)))*60}px)`;
  const two=k==1||k==0; $('#gb').style.opacity=gv*(two?1:0); $('#gb').style.transform=$('#ga').style.transform;
  $('#ra').textContent=c?c[0]:''; $('#rb').textContent=c&&c[2]?c[2]:''; $('#ra').style.opacity=c?gv:0; $('#rb').style.opacity=c&&c[2]?gv:0;
  if(k==0){ fill('ga',null,t,0); fill('gb',null,t,0); }
  else { fill('ga',c[1],t,S[k]+.5); if(c[3]) fill('gb',c[3],t,S[k]+1.4); }
  rv('#s4',t,S[4]+.9,.5,30,S[5]-.3);
  if(t>S[5]-.05) renderEndFit(t,S[5]); else $('#endf').style.opacity=0;
};
</script></body></html>
