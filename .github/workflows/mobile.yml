# FitPlanr native apps: signed Android APK + AAB (Google Play) and the iOS app (App Store / simulator).
# Run it from the Actions tab ("Run workflow") or push a tag like mobile-v1.0.1.
# Secrets (Settings → Secrets and variables → Actions):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#            GOOGLE_SERVICES_JSON_BASE64 (optional: Firebase config, turns on Android push)
#   iOS:     IOS_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_BASE64
#            (an App Store Connect API key with App Manager role: Xcode signs and uploads with it)
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.1)"
        default: "1.0.0"
  push:
    tags: ["mobile-v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Firebase config (push)
        if: env.HAS_FIREBASE == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
      - run: npx cap sync android
      - name: Upload key
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed APK + AAB
        working-directory: android
        env:
          FITPLANR_KEYSTORE: ${{ runner.temp }}/upload.jks
          FITPLANR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FITPLANR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FITPLANR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FITPLANR_VERSION_CODE: ${{ github.run_number }}
          FITPLANR_VERSION_NAME: ${{ inputs.version || github.ref_name }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fitplanr-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: fitplanr-ios-simulator
          path: build/sim/Build/Products/Debug-iphonesimulator/App.app
      - name: Archive + upload to App Store Connect (TestFlight)
        if: env.HAS_ASC_KEY == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          echo "${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}" | base64 -d > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/FitPlanr.xcarchive \
            DEVELOPMENT_TEAM=$TEAM CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ inputs.version || '1.0.0' }} $AUTH archive
          cat > build/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/FitPlanr.xcarchive -exportOptionsPlist build/export.plist \
            -exportPath build/export $AUTH
