<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060606" />
<title>FitPlanr · Offline</title>
<style>
  :root { --bg:#060606; --card:#0e0f0c; --line:rgb(255 255 255 / 9%); --fg:#f4f5f0; --muted:#8a8f82; --lime:#c8ff3d; --ink:#0a0d02; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background-image: radial-gradient(rgb(255 255 255 / 7%) 1px, transparent 1px), radial-gradient(60% 40% at 50% 0%, rgb(200 255 61 / 12%), transparent 70%);
    background-size: 22px 22px, 100% 100%; }
  .card { width: 100%; max-width: 360px; text-align: center; animation: in .5s cubic-bezier(.22,.8,.24,1) both; }
  .ring { width: 96px; height: 96px; margin: 0 auto 28px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
  .ring .track { stroke: rgb(255 255 255 / 9%); }
  .ring .arc { stroke: var(--lime); stroke-dasharray: 60 240; animation: spin 2.4s linear infinite; transform-origin: 50% 50%; }
  .ring .mark { position: absolute; inset: 26px; border-radius: 12px; background: var(--lime); display: grid; place-items: center; }
  .label { font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 700 40px/0.95 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: -.01em; margin: 12px 0 10px; }
  p { margin: 0 auto; color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 300px; }
  button { margin-top: 28px; height: 56px; width: 100%; border: 0; border-radius: 999px; background: var(--lime); color: var(--ink); font: 600 17px/1 Inter, system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 0 0 0 rgb(200 255 61 / 40%); animation: breathe 2.6s ease-in-out infinite; }
  button:active { transform: scale(.98); }
  .hint { margin-top: 14px; font-size: 13px; color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { box-shadow: 0 0 0 10px rgb(200 255 61 / 0%), 0 0 40px -6px rgb(200 255 61 / 45%); } }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="46" /><circle class="arc" cx="50" cy="50" r="46" /></svg>
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 32 32"><path d="M8 22.5 L14 16.5 L18 19.5 L24.5 11" stroke="#0A0D02" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
    </div>
    <div class="label">[ No connection ]</div>
    <h1>Your plan is one bar away.</h1>
    <p>FitPlanr needs the internet the first time it opens. Your plan and your logged sets are saved, nothing is lost.</p>
    <button id="retry" type="button">Try again</button>
    <div class="hint" id="hint">We'll reconnect on our own when you're back online.</div>
  </main>
  <script>
    var START = "https://fitplanr-3.vercel.app/app";
    function go() { document.getElementById("hint").textContent = "Reconnecting…"; location.replace(START); }
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
    try { var sp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen; if (sp) sp.hide(); } catch (e) {}
  </script>
</body>
</html>
